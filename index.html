<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="북평데이">
<meta name="theme-color" content="#fffdf8">
<title>북평데이 그림일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-width column: the diary page, then the two big actions, then a folded settings card. */
:root {
  --bg: #eef2ee; --surface: #ffffff; --ink: #2a2b33; --muted: #676977; --line: #d9ddd9;
  --accent: #2f78c9; --accent-ink: #ffffff; --chip: #f2f4f1; --danger: #d43c41;
  --shadow: 0 1px 2px rgba(40,50,40,.08), 0 12px 32px rgba(40,50,40,.12);
  --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181b; --surface: #202328; --ink: #ecedf1; --muted: #a2a5b0; --line: #343840;
    --accent: #6eaaf0; --accent-ink: #0f1a28; --chip: #2a2e34; --danger: #ff7a7e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; }
h1 span:nth-child(4n+1) { color: #e5484d; } h1 span:nth-child(4n+2) { color: #f08a24; }
h1 span:nth-child(4n+3) { color: #3f9e48; } h1 span:nth-child(4n+4) { color: #2f78c9; }
.sheet { position: relative; width: 100%; aspect-ratio: 4 / 5; }
.sheet img { display: block; width: 100%; height: 100%; border-radius: 4px; box-shadow: var(--shadow); background: #fffdf8; }
.busy {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; justify-items: center; text-align: center;
  background: rgba(255,253,248,.78); border-radius: 4px; color: #2a2b33; font-size: 15px; padding: 24px;
}
.busy i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #d9ddd9; border-top-color: #2f78c9; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.styles label { position: relative; }
.styles input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.styles span { display: block; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-display); font-size: 17px; }
.styles input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.styles input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; text-align: center; gap: 6px;
  font: inherit; font-family: var(--font-display); font-size: 18px; border-radius: 12px; padding: 14px 10px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn:focus-within, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 .btn { flex: 1 1 0; font-size: 15px; padding: 10px; }
.msg { margin: 0; font-size: 14px; color: var(--muted); text-align: center; min-height: 1.6em; overflow-wrap: anywhere; }
.msg.err { color: var(--danger); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
summary { cursor: pointer; font-family: var(--font-display); font-size: 17px; }
.settings { display: grid; gap: 12px; margin-top: 12px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { font: inherit; font-size: 15px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.small a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .busy i { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 aria-label="북평데이 그림일기"><span>북</span><span>평</span><span>데</span><span>이</span> <span>그</span><span>림</span><span>일</span><span>기</span></h1>

  <div class="sheet">
    <img id="out" alt="북평데이 그림일기">
    <div class="busy" id="busy" hidden><i aria-hidden="true"></i><span id="busyText">AI가 그림을 그리는 중이에요</span></div>
  </div>

  <div class="styles" role="radiogroup" aria-label="그림체">
    <label><input type="radio" name="style" id="style-crayon" value="crayon" checked><span>크레용 낙서</span></label>
    <label><input type="radio" name="style" id="style-pixar" value="pixar"><span>픽사풍 3D</span></label>
  </div>

  <div class="actions">
    <label class="btn" id="pickBtn">사진 찍기·고르기<input type="file" id="photo" accept="image/*"></label>
    <button class="btn ghost" id="save" type="button" disabled>사진첩에 저장</button>
  </div>
  <div class="row2">
    <button class="btn ghost" id="again" type="button" disabled>같은 사진 다시 그리기</button>
  </div>
  <p class="msg" id="msg"></p>

  <details id="settingsBox">
    <summary>설정 · Gemini API 키</summary>
    <div class="settings">
      <label class="field">API 키 (이 휴대폰에만 저장돼요)
        <input type="password" id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza로 시작하는 키">
      </label>
      <label class="field">그림 모델
        <select id="model">
          <option value="gemini-2.5-flash-image">Gemini 2.5 Flash Image (빠름, 저렴)</option>
          <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image (더 정교함, 더 비쌈)</option>
        </select>
      </label>
      <label class="field">직접 입력한 모델 이름 (비워 두면 위에서 고른 모델)
        <input type="text" id="modelCustom" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: gemini-2.5-flash-image">
      </label>
      <div class="row2">
        <button class="btn" id="saveKey" type="button">저장</button>
        <button class="btn ghost" id="clearKey" type="button">키 지우기</button>
      </div>
      <p class="small">키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 만들 수 있어요. 아이 사진이 학습에 쓰이지 않도록 결제가 연결된 유료 키를 쓰세요. 사진은 이 휴대폰에서 Google로 바로 전송되고, 이 웹사이트에는 저장되지 않아요.</p>
    </div>
  </details>
</div>

<script>
(() => {
  const W = 1080, H = 1350;
  const PH = { x: 20, y: 160, w: 1040, h: 1040 };
  const COL = { red: '#e5484d', orange: '#f08a24', yellow: '#f6c62f', green: '#45a849', blue: '#2f7fd1', pink: '#ec6fa0', purple: '#8e6bd8', brown: '#7a4a2a', sky: '#8cc3ef' };
  const DATE_COLORS = [COL.red, COL.orange, COL.green, COL.blue, COL.brown, COL.orange, COL.pink, COL.red, COL.blue, COL.green];
  const TITLE_COLORS = [COL.green, COL.orange, COL.blue, COL.pink];
  const DATE_TEXT = '2026.10.29 목요일', TITLE_TEXT = '북평데이';

  const $ = id => document.getElementById(id);
  function rng(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // ---------- textures ----------
  function makeGrain() {
    const c = mk(220, 220), x = c.getContext('2d'), r = rng(11);
    x.lineCap = 'round';
    for (let i = 0; i < 3200; i++) {
      const px = r() * 220, py = r() * 220, a = -0.95 + (r() - .5) * .6, l = 1 + r() * 5;
      x.strokeStyle = `rgba(0,0,0,${.15 + r() * .85})`; x.lineWidth = .6 + r() * 1.2;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
    }
    return c;
  }
  function makePaper() {
    const c = mk(256, 256), x = c.getContext('2d'), r = rng(5);
    for (let i = 0; i < 2600; i++) {
      x.fillStyle = `rgba(120,105,80,${r() * .09})`;
      x.fillRect(r() * 256, r() * 256, 1 + r() * 1.5, 1 + r() * 1.5);
    }
    x.strokeStyle = 'rgba(140,120,90,.05)';
    for (let i = 0; i < 90; i++) {
      const px = r() * 256, py = r() * 256, a = r() * 6.28, l = 6 + r() * 18;
      x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + 5, py + 5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
    }
    return c;
  }
  const grainCanvas = makeGrain(), paperCanvas = makePaper();
  function knockGrain(ctx, alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ctx.createPattern(grainCanvas, 'repeat');
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.restore();
  }

  // ---------- crayon drawing primitives ----------
  function framePoints(rc, r, amp) {
    const { x, y, w, h } = rc, R = 46, N = 300;
    const sw = w - 2 * R, sh = h - 2 * R, a = Math.PI * R / 2, total = 2 * sw + 2 * sh + 4 * a;
    const p = [r() * 6.28, r() * 6.28, r() * 6.28], pts = [];
    for (let i = 0; i < N; i++) {
      let d = i / N * total, px, py, t;
      if (d < sw) { px = x + R + d; py = y; }
      else if ((d -= sw) < a) { t = -Math.PI / 2 + d / R; px = x + w - R + Math.cos(t) * R; py = y + R + Math.sin(t) * R; }
      else if ((d -= a) < sh) { px = x + w; py = y + R + d; }
      else if ((d -= sh) < a) { t = d / R; px = x + w - R + Math.cos(t) * R; py = y + h - R + Math.sin(t) * R; }
      else if ((d -= a) < sw) { px = x + w - R - d; py = y + h; }
      else if ((d -= sw) < a) { t = Math.PI / 2 + d / R; px = x + R + Math.cos(t) * R; py = y + h - R + Math.sin(t) * R; }
      else if ((d -= a) < sh) { px = x; py = y + h - R - d; }
      else { d -= sh; t = Math.PI + d / R; px = x + R + Math.cos(t) * R; py = y + R + Math.sin(t) * R; }
      const u = i / N * Math.PI * 2;
      pts.push([px + amp * (Math.sin(u * 6 + p[0]) * .5 + Math.sin(u * 17 + p[2]) * .25), py + amp * (Math.sin(u * 8 + p[1]) * .5 + Math.sin(u * 19 + p[0]) * .25)]);
    }
    return pts;
  }
  function polyPath(c, pts) {
    c.beginPath();
    const n = pts.length;
    c.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
    for (let i = 1; i <= n; i++) {
      const p = pts[i % n], q = pts[(i + 1) % n];
      c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    c.closePath();
  }
  function scribble(c, build, color, box, r, lw = 3.2) {
    c.save(); build(c); c.clip();
    c.strokeStyle = color; c.lineWidth = lw; c.lineCap = 'round';
    const [x0, y0, x1, y1] = box, span = (x1 - x0) + (y1 - y0);
    for (let d = -span; d < span; d += lw * .85) {
      c.globalAlpha = .6 + r() * .35;
      c.beginPath(); c.moveTo(x0 + d, y1 + (r() - .5) * 3); c.lineTo(x0 + d + (y1 - y0), y0 + (r() - .5) * 3); c.stroke();
    }
    c.restore();
  }
  function line(c, build, color, lw, r, passes = 2) {
    for (let i = 0; i < passes; i++) {
      c.save(); c.translate((r() - .5) * 1.8, (r() - .5) * 1.8);
      build(c);
      c.strokeStyle = color; c.lineWidth = lw * (.75 + r() * .4); c.globalAlpha = .8;
      c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); c.restore();
    }
  }
  function solid(c, build, color) { c.save(); build(c); c.fillStyle = color; c.fill(); c.restore(); }
  const circle = (x, y, rad) => c => { c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); };
  const PAPER = '#fffdf8';

  // ---------- doodles (local coords, centred on 0,0) ----------
  const D = {
    heart(c, s, r, col = COL.pink) {
      const b = c => { c.beginPath(); c.moveTo(0, s * .75); c.bezierCurveTo(-s * 1.3, -s * .1, -s * .6, -s * 1.05, 0, -s * .35); c.bezierCurveTo(s * .6, -s * 1.05, s * 1.3, -s * .1, 0, s * .75); c.closePath(); };
      scribble(c, b, col, [-s * 1.3, -s, s * 1.3, s * .8], r);
      line(c, b, col, 4, r);
    },
    star(c, s, r) {
      const b = c => { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * .45 : s; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); };
      scribble(c, b, '#fbe27a', [-s, -s, s, s], r);
      line(c, b, COL.yellow, 5, r);
    },
    sun(c, s, r) {
      c.save(); c.strokeStyle = COL.orange; c.lineCap = 'round';
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + .2;
        line(c, c => { c.beginPath(); c.moveTo(Math.cos(a) * s * 1.22, Math.sin(a) * s * 1.22); c.lineTo(Math.cos(a) * s * 1.62, Math.sin(a) * s * 1.62); }, COL.orange, 5, r, 1);
      }
      c.restore();
      scribble(c, circle(0, 0, s), COL.yellow, [-s, -s, s, s], r, 3.6);
      line(c, circle(0, 0, s), COL.orange, 4, r);
      solid(c, circle(-s * .32, -s * .12, s * .09), COL.brown);
      solid(c, circle(s * .32, -s * .12, s * .09), COL.brown);
      line(c, c => { c.beginPath(); c.arc(0, s * .1, s * .38, .35, Math.PI - .35); }, COL.brown, 3.5, r);
      scribble(c, circle(-s * .55, s * .22, s * .14), '#f7a3a3', [-s, 0, 0, s * .5], r, 2.4);
      scribble(c, circle(s * .55, s * .22, s * .14), '#f7a3a3', [0, 0, s, s * .5], r, 2.4);
    },
    cloud(c, s, r, x0 = 0, y0 = 0) {
      const circles = [[-s * .55, s * .1, s * .45], [0, -s * .22, s * .58], [s * .58, s * .1, s * .44], [0, s * .25, s * .42]].map(([x, y, rr]) => [x + x0, y + y0, rr]);
      const b = c => { c.beginPath(); circles.forEach(([x, y, rr]) => { c.moveTo(x + rr, y); c.arc(x, y, rr, 0, Math.PI * 2); }); };
      circles.forEach(([x, y, rr]) => line(c, circle(x, y, rr), COL.blue, 4.5, r, 1));
      solid(c, b, PAPER);
      scribble(c, b, '#d4e8f8', [x0 - s * 1.1, y0 - s * .9, x0 + s * 1.1, y0 + s * .8], r, 3);
    },
    rain(c, s, r) {
      D.cloud(c, s, r, 0, -s * .35);
      for (let i = 0; i < 4; i++) { const x = -s * .6 + i * s * .4; line(c, c => { c.beginPath(); c.moveTo(x, s * .45); c.lineTo(x - s * .12, s * .85); }, COL.blue, 4.5, r); }
    },
    snow(c, s, r) {
      D.cloud(c, s, r, 0, -s * .35);
      [[-s * .55, s * .7], [0, s * .85], [s * .55, s * .7]].forEach(([x, y]) => {
        for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; line(c, c => { c.beginPath(); c.moveTo(x - Math.cos(a) * s * .14, y - Math.sin(a) * s * .14); c.lineTo(x + Math.cos(a) * s * .14, y + Math.sin(a) * s * .14); }, COL.sky, 3.5, r, 1); }
      });
    },
    part(c, s, r) {
      c.save(); c.translate(s * .35, -s * .35); D.sun(c, s * .7, r); c.restore();
      D.cloud(c, s * .8, r, -s * .25, s * .3);
    },
    bear(c, s, r) {
      const ears = [[-s * .62, -s * .6], [s * .62, -s * .6]];
      ears.forEach(([x, y]) => { solid(c, circle(x, y, s * .3), PAPER); line(c, circle(x, y, s * .3), COL.brown, 4.5, r); scribble(c, circle(x, y, s * .14), '#f2a7a7', [x - s * .2, y - s * .2, x + s * .2, y + s * .2], r, 2.4); });
      const head = c => { c.beginPath(); c.ellipse(0, 0, s * .82, s * .72, 0, 0, Math.PI * 2); };
      solid(c, head, PAPER);
      line(c, head, COL.brown, 5, r);
      solid(c, circle(-s * .3, -s * .06, s * .075), '#2b211c');
      solid(c, circle(s * .3, -s * .06, s * .075), '#2b211c');
      solid(c, c => { c.beginPath(); c.ellipse(0, s * .12, s * .08, s * .06, 0, 0, Math.PI * 2); }, '#2b211c');
      line(c, c => { c.beginPath(); c.arc(-s * .1, s * .2, s * .1, .2, Math.PI - .4); c.moveTo(s * .2, s * .22); c.arc(s * .1, s * .2, s * .1, .4, Math.PI - .2); }, '#2b211c', 3, r, 1);
      scribble(c, circle(-s * .5, s * .2, s * .13), '#f4a3a3', [-s * .7, 0, -s * .3, s * .4], r, 2.4);
      scribble(c, circle(s * .5, s * .2, s * .13), '#f4a3a3', [s * .3, 0, s * .7, s * .4], r, 2.4);
    },
    flower(c, s, r, col = COL.pink, stem = .9) {
      if (stem) {
        line(c, c => { c.beginPath(); c.moveTo(0, s * .3); c.quadraticCurveTo(s * .1, s * (.3 + stem * .6), 0, s * (.3 + stem)); }, COL.green, 4.5, r);
        const leaf = (sx) => c => { c.beginPath(); c.ellipse(sx * s * .32, s * (.3 + stem * .65), s * .3, s * .12, sx * -.5, 0, Math.PI * 2); };
        [-1, 1].forEach(sx => { scribble(c, leaf(sx), COL.green, [-s, 0, s, s * 2], r, 3); line(c, leaf(sx), '#2f8a3a', 3, r, 1); });
      }
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + i * Math.PI * 2 / 5, px = Math.cos(a) * s * .45, py = Math.sin(a) * s * .45;
        solid(c, circle(px, py, s * .36), PAPER);
        scribble(c, circle(px, py, s * .36), col, [px - s * .4, py - s * .4, px + s * .4, py + s * .4], r, 3);
        line(c, circle(px, py, s * .36), col, 3.5, r, 1);
      }
      scribble(c, circle(0, 0, s * .24), COL.yellow, [-s * .3, -s * .3, s * .3, s * .3], r, 3);
      line(c, circle(0, 0, s * .24), COL.orange, 3, r, 1);
    },
    car(c, s, r) {
      const body = c => { c.beginPath(); c.moveTo(-s, s * .35); c.lineTo(-s, 0); c.quadraticCurveTo(-s, -s * .12, -s * .8, -s * .12); c.lineTo(-s * .55, -s * .12); c.lineTo(-s * .32, -s * .55); c.lineTo(s * .35, -s * .55); c.lineTo(s * .62, -s * .12); c.lineTo(s * .85, -s * .1); c.quadraticCurveTo(s, -s * .05, s, s * .12); c.lineTo(s, s * .35); c.closePath(); };
      scribble(c, body, COL.red, [-s, -s * .6, s, s * .4], r, 3.4);
      line(c, body, '#c43337', 4.5, r);
      const win = (x0, x1) => c => { c.beginPath(); c.moveTo(x0, -s * .15); c.lineTo(x0 + s * .14, -s * .45); c.lineTo(x1, -s * .45); c.lineTo(x1 + (x1 > 0 ? s * .17 : 0), -s * .15); c.closePath(); };
      [win(-s * .45, -s * .06), win(s * .04, s * .3)].forEach(b => { solid(c, b, PAPER); scribble(c, b, '#cfe7f7', [-s, -s * .5, s, 0], r, 2.6); line(c, b, '#c43337', 3, r, 1); });
      [-s * .55, s * .55].forEach(x => { solid(c, circle(x, s * .38, s * .22), '#2e2b2b'); solid(c, circle(x, s * .38, s * .08), '#bdbdbd'); });
    },
    grass(c, s, r) {
      line(c, c => { c.beginPath(); c.moveTo(-s, s * .4); c.lineTo(-s * .7, -s * .3); c.lineTo(-s * .4, s * .4); c.lineTo(-s * .05, -s * .5); c.lineTo(s * .25, s * .4); c.lineTo(s * .6, -s * .25); c.lineTo(s * .9, s * .4); }, COL.green, 4.5, r);
    },
    spark(c, s, r) {
      [[-.9, -.5], [0, -1], [.9, -.5]].forEach(([dx, dy]) => line(c, c => { c.beginPath(); c.moveTo(dx * s * .5, dy * s * .5); c.lineTo(dx * s, dy * s); }, COL.orange, 4, r, 1));
    }
  };
  function doodle(c, kind, x, y, s, rot, r, ...extra) {
    c.save(); c.translate(x, y); c.rotate(rot); D[kind](c, s, r, ...extra); c.restore();
  }

  // ---------- lettering ----------
  function letters(c, text, cx, cy, maxW, size, colors, r) {
    const chars = [...text];
    let fs = size, widths, total;
    const gap = () => fs * .04;
    const measure = () => { c.font = `${fs}px Jua, "Gowun Dodum", sans-serif`; widths = chars.map(ch => c.measureText(ch).width); total = widths.reduce((a, b) => a + b, 0) + gap() * (chars.length - 1); };
    measure();
    while (total > maxW && fs > 30) { fs -= 2; measure(); }
    let x = cx - total / 2, ci = 0;
    c.textBaseline = 'middle'; c.textAlign = 'left'; c.lineJoin = 'round';
    chars.forEach((ch, i) => {
      if (ch.trim()) {
        const col = colors[ci++ % colors.length];
        c.save();
        c.translate(x + widths[i] / 2, cy + (r() - .5) * fs * .08);
        c.rotate((r() - .5) * .12);
        c.fillStyle = col; c.strokeStyle = col; c.lineWidth = fs * .045;
        for (let p = 0; p < 3; p++) {
          c.globalAlpha = .7;
          const ox = (r() - .5) * 2, oy = (r() - .5) * 2;
          c.fillText(ch, -widths[i] / 2 + ox, oy);
          c.strokeText(ch, -widths[i] / 2 + ox, oy);
        }
        c.restore();
      }
      x += widths[i] + gap();
    });
  }

  // ragged crayon-edged vignette: the scene thins out into the paper like the strokes just stopped
  let maskCache = null;
  function fadeMask() {
    if (maskCache) return maskCache;
    const w = PH.w, h = PH.h, m = mk(w, h), c = m.getContext('2d'), r = rng(19);
    const inner = 120, outer = 18;
    c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.lineCap = 'round';
    c.fillRect(inner, inner, w - 2 * inner, h - 2 * inner);
    for (let y = 0; y < h; y += 5) {
      for (let x = 0; x < w; x += 5) {
        const e = Math.min(x, y, w - x, h - y);
        const cx = Math.abs(x - w / 2) / (w / 2), cy = Math.abs(y - h / 2) / (h / 2);
        const corner = Math.hypot(Math.max(0, cx - .72), Math.max(0, cy - .72)) * 260;
        const v = Math.min(1, Math.max(0, (e - outer - corner) / (inner - outer)));
        if (v <= 0 || r() > v * v * 1.15) continue;
        const a = -1 + (r() - .5) * .7, l = 8 + r() * 14;
        c.globalAlpha = .5 + r() * .5; c.lineWidth = 3 + r() * 4;
        c.beginPath(); c.moveTo(x - Math.cos(a) * l / 2, y - Math.sin(a) * l / 2); c.lineTo(x + Math.cos(a) * l / 2, y + Math.sin(a) * l / 2); c.stroke();
      }
    }
    return maskCache = m;
  }


  // ---------- prompts (from the 북평데이 낙서 그림일기 skill) ----------
  const COMMON = [
    'Use the attached photo as the reference. Keep the number of people, composition, pose, facial expression, hairstyle, clothing colours and details, and the key props they hold.',
    'Keep the likeness of each face but draw the eyes, nose and mouth simply and lovingly, with rosy cheeks and a small smile. Do not add or remove people.',
    'Simplify the background but keep the main sense of the room or place and its key objects, drawn simply and cutely.',
    'Square composition. Leave clean white paper visible around the outer edges.',
    'IMPORTANT: do not write any text, letters, numbers, dates or captions anywhere in the image.'
  ].join(' ');
  const PROMPTS = {
    crayon: 'Redraw this photo as a page of a toddler\'s picture diary, drawn by a young child with crayons and coloured pencils on white paper. ' +
      'Simple and rough: wobbly hand-drawn outlines, uneven lines, visible crayon and pencil grain on paper, colouring that goes slightly outside the lines, clumsy but lovable proportions. ' +
      'Soft warm pastel palette of pink, sky blue, yellow, light green and orange. Warm, pure, baby-diary mood. ' +
      'In the empty margins add a few small crayon doodles: hearts, stars, flowers, a bear face, a small car, grass and little curly lines, never covering faces. ' +
      'Not photorealistic, not 3D, not smooth vector, not digital painting. ' + COMMON,
    pixar: 'Redraw this photo as a still frame from a modern 3D animated family feature film. ' +
      'Soft rounded features, large bright expressive eyes, smooth stylised 3D skin and fabric, warm cinematic key light with soft shadows and gentle rim light, rich but soft colours, shallow depth of field in the background. ' +
      'The person must still clearly look like the person in the photo. Friendly, heartwarming mood. ' + COMMON
  };

  // ---------- settings ----------
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
  };
  $('key').value = store.get('bp.key');
  $('model').value = store.get('bp.model') || 'gemini-2.5-flash-image';
  $('modelCustom').value = store.get('bp.modelCustom');
  if (!store.get('bp.key')) $('settingsBox').open = true;
  $('saveKey').addEventListener('click', () => {
    store.set('bp.key', $('key').value.trim()); store.set('bp.model', $('model').value); store.set('bp.modelCustom', $('modelCustom').value.trim());
    say($('key').value.trim() ? '설정을 저장했어요. 이제 사진을 찍어 보세요.' : 'API 키를 넣어 주세요.');
    if ($('key').value.trim()) $('settingsBox').open = false;
  });
  $('clearKey').addEventListener('click', () => { store.set('bp.key', ''); $('key').value = ''; say('이 휴대폰에서 API 키를 지웠어요.'); });
  const modelName = () => store.get('bp.modelCustom') || store.get('bp.model') || 'gemini-2.5-flash-image';

  // ---------- page composition ----------
  const LAYOUT = [
    ['heart', 270, 300, 40, -.15], ['bear', 140, 740, 82, -.05], ['star', 270, 700, 34, .2],
    ['grass', 95, 900, 36, 0], ['heart', 770, 540, 40, .12], ['heart', 840, 770, 34, -.1],
    ['star', 975, 760, 42, .15], ['car', 940, 860, 64, -.04], ['grass', 985, 935, 30, 0]
  ];
  function compose(scene, style) {
    const cv = mk(W, H), x = cv.getContext('2d');
    x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
    x.fillStyle = x.createPattern(paperCanvas, 'repeat'); x.fillRect(0, 0, W, H);
    if (scene) {
      const s = mk(PH.w, PH.h), sx = s.getContext('2d');
      const iw = scene.naturalWidth || scene.width, ih = scene.naturalHeight || scene.height, k = Math.max(PH.w / iw, PH.h / ih);
      sx.imageSmoothingQuality = 'high';
      sx.drawImage(scene, (PH.w - iw * k) / 2, (PH.h - ih * k) / 2, iw * k, ih * k);
      sx.globalCompositeOperation = 'destination-in'; sx.drawImage(fadeMask(), 0, 0);
      x.drawImage(s, PH.x, PH.y);
    }
    const ink = mk(W, H), k = ink.getContext('2d'), r = rng(2);
    letters(k, DATE_TEXT, 470, 92, 820, 110, DATE_COLORS, r);
    doodle(k, 'sun', 972, 92, 50, 0, r);
    letters(k, TITLE_TEXT, 540, 1262, 580, 96, TITLE_COLORS, r);
    doodle(k, 'flower', 98, 1238, 52, -.08, r, COL.pink, .9);
    doodle(k, 'heart', 215, 1290, 24, -.2, r, '#f07b8f');
    doodle(k, 'heart', 870, 1270, 22, .15, r, '#f07b8f');
    doodle(k, 'flower', 982, 1228, 50, .1, r, COL.yellow, .9);
    // the crayon prompt asks the AI to draw its own doodles; the 3D frame gets hand-drawn ones on top
    if (style !== 'crayon' || !scene) LAYOUT.forEach(([kind, lx, ly, ls, rot]) => doodle(k, kind, lx, ly, ls, rot, r));
    knockGrain(k, .32);
    x.drawImage(ink, 0, 0);
    return cv;
  }

  // ---------- Gemini call ----------
  function photoToBase64(img) {
    const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(1, 1536 / Math.max(iw, ih));
    const c = mk(Math.round(iw * s), Math.round(ih * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  }
  async function generate(b64, style, signal) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName())}:generateContent`, {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': store.get('bp.key') },
      body: JSON.stringify({
        contents: [{ parts: [{ text: PROMPTS[style] }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
        generationConfig: { responseModalities: ['TEXT', 'IMAGE'], imageConfig: { aspectRatio: '1:1' } }
      })
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = (json.error && json.error.message) || '';
      if (res.status === 400 && /API key/i.test(m)) throw new Error('API 키가 올바르지 않아요. 설정에서 키를 다시 확인해 주세요.');
      if (res.status === 403) throw new Error('이 키로는 그림 모델을 쓸 수 없어요. Google AI Studio에서 결제 연결과 권한을 확인해 주세요.');
      if (res.status === 404) throw new Error(`"${modelName()}" 모델을 찾을 수 없어요. 설정에서 다른 모델을 골라 주세요.`);
      if (res.status === 429) throw new Error('사용 한도를 넘었어요. 잠시 뒤 다시 하거나 결제 설정을 확인해 주세요.');
      throw new Error(`그림을 받지 못했어요 (${res.status}). ${m}`);
    }
    const parts = (json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) || [];
    const imgPart = parts.find(p => p.inlineData || p.inline_data);
    if (!imgPart) {
      const reason = (json.candidates && json.candidates[0] && json.candidates[0].finishReason) || (json.promptFeedback && json.promptFeedback.blockReason) || '';
      throw new Error('AI가 이 사진으로는 그림을 만들지 않았어요' + (reason ? ` (${reason})` : '') + '. 안전 정책 때문일 수 있어요. 다른 사진으로 해 보세요.');
    }
    const d = imgPart.inlineData || imgPart.inline_data;
    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = () => bad(new Error('받은 그림을 열지 못했어요.')); img.src = `data:${d.mimeType || d.mime_type || 'image/png'};base64,${d.data}`; });
    return img;
  }

  // ---------- flow ----------
  const out = $('out'), busy = $('busy'), msg = $('msg'), saveBtn = $('save'), againBtn = $('again');
  let photoB64 = null, lastBlob = null, objUrl = null, working = false;
  const style = () => document.querySelector('input[name="style"]:checked').value;
  function say(t, err) { msg.textContent = t; msg.classList.toggle('err', !!err); }
  async function show(canvas) {
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', .92));
    lastBlob = blob; if (objUrl) URL.revokeObjectURL(objUrl); objUrl = URL.createObjectURL(blob); out.src = objUrl;
  }
  async function run() {
    if (!photoB64 || working) return;
    if (!store.get('bp.key')) { $('settingsBox').open = true; say('먼저 설정에서 Gemini API 키를 저장해 주세요.', true); return; }
    working = true; busy.hidden = false; saveBtn.disabled = true; againBtn.disabled = true;
    const st = style(), t0 = Date.now();
    $('busyText').textContent = (st === 'pixar' ? '픽사풍 3D' : '크레용 낙서') + ' 그림을 그리는 중이에요. 10~40초쯤 걸려요.';
    say('');
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 120000);
    try {
      await fontsReady;
      const scene = await generate(photoB64, st, ctl.signal);
      await show(compose(scene, st));
      say(`완성! ${Math.round((Date.now() - t0) / 1000)}초 걸렸어요. 마음에 안 들면 "같은 사진 다시 그리기"를 눌러 보세요.`);
      saveBtn.disabled = false;
    } catch (e) {
      say(e.name === 'AbortError' ? '2분이 지나도 답이 없어서 멈췄어요. 다시 해 보세요.' : (e.message || '그림을 만들지 못했어요.'), true);
    } finally {
      clearTimeout(timer); working = false; busy.hidden = true; againBtn.disabled = !photoB64;
    }
  }

  $('photo').addEventListener('change', e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { photoB64 = photoToBase64(img); URL.revokeObjectURL(url); run(); };
    img.onerror = () => { URL.revokeObjectURL(url); say('이 사진은 열 수 없어요. 다른 사진으로 해 보세요.', true); };
    img.src = url;
  });
  againBtn.addEventListener('click', run);
  document.querySelectorAll('input[name="style"]').forEach(el => el.addEventListener('change', () => { if (photoB64) say('그림체를 바꿨어요. "같은 사진 다시 그리기"를 누르면 새 그림체로 그려요.'); }));

  saveBtn.addEventListener('click', async () => {
    if (!lastBlob) return;
    const name = `북평데이-${Date.now()}.jpg`;
    const file = new File([lastBlob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); say('공유 창에서 "이미지 저장"을 누르면 사진첩에 들어가요.'); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = objUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    say('그림을 내려받았어요. 사진첩에 안 보이면 그림을 길게 눌러 "사진에 저장"을 골라 주세요.');
  });

  const fontsReady = (document.fonts ? Promise.race([
    document.fonts.load('80px Jua', DATE_TEXT + TITLE_TEXT), new Promise(res => setTimeout(res, 3000))
  ]) : Promise.resolve()).catch(() => {});
  fontsReady.then(() => show(compose(null, 'pixar')));
  say(store.get('bp.key') ? '"사진 찍기·고르기"를 눌러 시작하세요. 1장에 약 50원이 들어요.' : '처음 한 번만 아래 설정에 Gemini API 키를 넣어 주세요.');
})();
</script>
</body>
</html>
